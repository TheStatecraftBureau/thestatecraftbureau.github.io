<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devlog разработки — State Rise: From Ashes | The Statecraft Bureau</title>

    <link rel="icon" type="image/png" href="../../favicon.png" sizes="32x32">
    <link rel="stylesheet" href="/StateRise/css/style.css">
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "The Statecraft Bureau",
    "url": "https://thestatecraftbureau.github.io/StateRise/",
    "logo": "https://thestatecraftbureau.github.io/StateRise/assets/studio_logo.png",
    "sameAs": [
        "https://vk.com/devlogstaterise",
        "https://x.com/StateDevLog",
        "https://thestatecraftbureau.itch.io",
        "https://t.me/TheStatecraftBureau"
    ]
    }
    </script>
    <meta name="description"
      content="State Rise: From Ashes — стратегическая RTS о развитии государства, экономике, инфраструктуре, геополитике и системных решениях. Проект студии The Statecraft Bureau.">
    <link rel="canonical" href="https://thestatecraftbureau.github.io/StateRise/devlog/">
</head>

<body>
    <div class="global-bg"></div>

    <header class="topbar">
        <button class="burger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <div class="logo">
            <img src="/StateRise/assets/studio_logo.png" alt="The Statecraft Bureau" class="studio-logo rounded-logo">

            <a href="/StateRise/" class="game-title">State Rise: From Ashes</a>
        </div>

        <nav class="menu">
            <a href="/StateRise/about/">О разработчике</a>
            <a href="/StateRise/project/">О проекте</a>
            <a href="/StateRise/devlog/">Devlog</a>
            <a href="/StateRise/contacts/">Контакты</a>
            <div class="lang-dropdown">
                <button class="lang-current">RU ▾</button>
                <div class="lang-menu">
                    <a href="/StateRise/devlog/">RU</a>
                    <a href="/StateRise/en/devlog/">EN</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="hero">
        <div class="overlay-box" id="devlog-list">
            <h1>Devlog</h1>
        </div>
    </main>

    <footer class="footer">
        <div>© 2025-2026 The Statecraft Bureau</div>
        <div class="socials">
            <a href="https://vk.com/devlogstaterise">VK</a>
            <a href="https://x.com/StateDevLog">X/Twitter</a>
            <a href="https://thestatecraftbureau.itch.io">Itch.io</a>
            <a href="https://t.me/TheStatecraftBureau">Telegram</a>
        </div>
    </footer>

    <script>
    fetch("/StateRise/data/devlog.json")
        .then(r => r.json())
        .then(entries => {
            const container = document.getElementById("devlog-list");
            
            entries.reverse().forEach(e => {
                container.innerHTML += `
                    <div class="devlog-entry">
                        ${e.cover ? `<img src="${e.cover}" class="devlog-cover">` : ""}

                        <h2>
                            <a href="/StateRise/devlog/post.html?id=${e.id}">
                                ${e.title}
                            </a>
                        </h2>
                        <small>${e.date}</small>
                        <p>${e.preview}</p>
                    </div>
                    <hr>
                `;
            });
        });
    </script>

    <script>
    document.addEventListener("click", function (e) {
        const dropdown = document.querySelector(".lang-dropdown");
        if (!dropdown) return;

        if (dropdown.contains(e.target) && e.target.classList.contains("lang-current")) {
            dropdown.classList.toggle("open");
            return;
        }

        dropdown.classList.remove("open");
    });
    </script>

    <script>
    const burger = document.querySelector(".burger");
    const menu = document.querySelector(".menu");

    burger.addEventListener("click", () => {
        burger.classList.toggle("open");
        menu.classList.toggle("open");
    });

    // закрытие меню по клику вне
    document.addEventListener("click", e => {
        if (!menu.contains(e.target) && !burger.contains(e.target)) {
            burger.classList.remove("open");
            menu.classList.remove("open");
        }
    });
    </script>

</body>
</html>
